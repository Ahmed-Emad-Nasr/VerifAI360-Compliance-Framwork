# NOTE: Streamlit only reads its config from `.streamlit/config.toml` (or
# `~/.streamlit/config.toml`), never from a file named `config.toml` in the
# project root. This copy sat here unread, which meant the 25 MB server-side
# upload cap and the native theme colours were never actually applied — the
# app fell back to Streamlit's defaults (200 MB uploads, default palette).
#
# The live copy is now `.streamlit/config.toml`. This file is kept only so
# that anyone who edits the path they already know about sees this note.
# Edit `.streamlit/config.toml` instead; the two should stay identical.
